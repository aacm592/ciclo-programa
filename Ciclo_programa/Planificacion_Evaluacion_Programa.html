a y Tropa y colaboro en su organización.`,`Me gusta participar en actividades que ayudan a superar las diferencias sociales.`,`Conozco los diferentes pensamientos y posiciones políticas que hay en mi país.`,`Conozco la geografía de mi país y su influencia con nuestra cultura.`,`Aprecio la cultura de mi país y me identifico con ella.`,`Propongo en mi patrulla y Tropa, actividades que muestren los valores propios de la cultura de nuestro país.`,`Conozco el Movimiento Scout de mi país.`,`Participo en los contactos que mantiene mi Grupo con scouts de otros países.`,`Me gusta saber cómo viven las personas en otros países.`,`Sé cuáles son los principales problemas ambientales de mi país.`,`Me intereso en conocer en detalle una cultura originaria de América.`,`Aplico técnicas que me permiten mejorar el medio ambiente y no dañar los lugares en que acampo.`,`Participo con mi patrulla o Tropa en proyectos de conservación.`]},Espiritualidad:{media:[`Reflexiono con mi patrulla cuando hacemos excursiones o campamentos.`,`Escucho a los demás y aprendo de ellos.`,`Conozco los fundamentos de mi fe.`,`Soy constante en los compromisos que he asumido con mi religión.`,`Asumo tareas en las celebraciones religiosas que hacemos en mi tropa.`,`Me gusta rezar y trato de hacerlo todos los días.`,`Siempre encuentro en lo que hago, razones para pedir y dar gracias a Dios.`,`Rezo habitualmente con mi patrulla.`,`Trato de vivir las enseñanzas de mi fe en todo lo que hago.`,`Entiendo por qué mi religión me pide que ayude a los demás.`,`Sé cuáles son las principales religiones que hay en mi país.`,`Comparto con todas las personas, sean o no sean de mi religión.`],tardia:[`Preparo y conduzco suficientes actividades que nos ayudan a descubrir a Dios en la naturaleza.`,`Procuro que en mi patrulla nos escuchemos y aprendamos unos de otros.`,`Leo los libros sagrados de mi fe y converso con adultos que me ayudan a conocerla mejor.`,`Participo en las celebraciones y actividades de mi religión.`,`Comparto con mi familia reflexiones de los textos sagrados de mi fe.`,`Entiendo la oración como una manera de conversar con Dios.`,`Rezo para conversar con Dios y alabarlo, darle gracias, ofrecerle lo que hago y pedirle por las cosas que me pasan.`,`Me siento feliz cuando los demás ven en mí a una persona que vive de acuerdo a su fe.`,`Organizo y comparto momentos de oración con mi patrulla y mi familia.`,`Invito a mi patrulla a cooperar con las acciones que nuestra religión hace por los demás.`,`Me interesa conocer otras religiones.`,`Actúo con respeto frente a las ideas, celebraciones y actividades de otras religiones.`,`Trato que en mi patrulla se respeten las opciones religiosas de las personas.`]}},_C={class:`bg-white/40 dark:bg-slate-900/40 border border-white/60 dark:border-white/10 p-4 rounded-xl space-y-4 transition-colors`},vC={class:`flex flex-col gap-1.5 w-full`},yC={class:`text-xs font-display font-bold text-morado dark:text-slate-200 uppercase tracking-wider`},bC={class:`relative`},xC=[`value`],SC={class:`space-y-1.5`},CC={class:`relative`},wC=[`disabled`],TC=[`value`,`title`],EC={class:`space-y-1.5`},DC={class:`relative`},OC=[`disabled`],kC=[`value`,`title`],AC={__name:`ObjetivoEducativoCard`,props:{objetivo:{type:Object,required:!0},numero:{type:Number,required:!0}},setup(e){let t=e,n=()=>{t.objetivo.media=``,t.objetivo.tardia=``};return(t,r)=>(L(),R(`div`,_C,[z(`div`,vC,[z(`label`,yC,` Área `+M(e.numero),1),z(`div`,bC,[Hn(z(`select`,{"onUpdate:modelValue":r[0]||=t=>e.objetivo.area=t,onChange:n,class:`w-full bg-white/70 dark:bg-black/30 border border-gris-lavanda/30 dark:border-white/10 rounded-xl px-3 py-2 pr-8 text-slate-800 dark:text-slate-200 font-sans text-sm outline-none focus:ring-2 focus:ring-jade/30 transition-all cursor-pointer appearance-none`},[r[3]||=z(`option`,{value:``,disabled:``},`Selecciona un área...`,-1),(L(!0),R(I,null,Gr(F(hC),e=>(L(),R(`option`,{key:e,value:e},M(e),9,xC))),128))],544),[[_s,e.objetivo.area]]),r[4]||=z(`div`,{class:`poi
